<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', 'Arial Black', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Variante 1: Blanco sobre negro #050608 -->
  <rect x="0" y="0" width="280" height="120" fill="#050608"/>
  <!-- Grid sutil -->
  <line x1="0" y1="20" x2="280" y2="20" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="0" y1="40" x2="280" y2="40" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="0" y1="60" x2="280" y2="60" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="0" y1="80" x2="280" y2="80" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="0" y1="100" x2="280" y2="100" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="120" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="120" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="120" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="120" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="120" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="120" stroke="rgba(59,130,246,0.04)" stroke-width="1"/>
  <text x="20" y="80" font-weight="800" font-size="52" letter-spacing="-2" fill="#F5F7FA">Stratika.</text>
  <!-- Línea gradiente (simulada como degradado lineal) -->
  <defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient></defs>
  <rect x="0" y="118" width="280" height="2" fill="url(#g1)"/>
  <!-- Label -->
  <text x="10" y="108" font-size="9" letter-spacing="2" fill="rgba(245,247,250,0.3)" font-family="monospace">PRINCIPAL · #050608</text>

  <!-- Variante 2: Blanco sobre deep #0B1117 -->
  <rect x="300" y="0" width="280" height="120" fill="#0B1117"/>
  <text x="320" y="80" font-weight="800" font-size="52" letter-spacing="-2" fill="#F5F7FA">Stratika.</text>
  <text x="310" y="108" font-size="9" letter-spacing="2" fill="rgba(245,247,250,0.3)" font-family="monospace">DEEP · #0B1117</text>

  <!-- Variante 3: Blanco sobre surface #1F2933 -->
  <rect x="600" y="0" width="280" height="120" fill="#1F2933"/>
  <text x="620" y="80" font-weight="800" font-size="52" letter-spacing="-2" fill="#F5F7FA">Stratika.</text>
  <text x="610" y="108" font-size="9" letter-spacing="2" fill="rgba(245,247,250,0.3)" font-family="monospace">SURFACE · #1F2933</text>

  <!-- Variante 4: Negro sobre claro #F5F7FA -->
  <rect x="900" y="0" width="280" height="120" fill="#F5F7FA"/>
  <text x="920" y="80" font-weight="800" font-size="52" letter-spacing="-2" fill="#050608">Stratika.</text>
  <text x="910" y="108" font-size="9" letter-spacing="2" fill="rgba(5,6,8,0.35)" font-family="monospace">CLARA · #F5F7FA</text>

  <!-- Variante azul (portadas especiales) -->
  <rect x="0" y="140" width="280" height="120" fill="#050608"/>
  <!-- Border sutil azul -->
  <rect x="0" y="140" width="280" height="120" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="20" y="220" font-weight="800" font-size="52" letter-spacing="-2" fill="#3B82F6">Stratika.</text>
  <text x="10" y="248" font-size="9" letter-spacing="2" fill="rgba(59,130,246,0.5)" font-family="monospace">AZUL · SOLO PORTADAS</text>

  <!-- Favicon -->
  <rect x="300" y="140" width="64" height="64" fill="#050608"/>
  <text x="305" y="192" font-weight="800" font-size="46" letter-spacing="-2" fill="#F5F7FA">S.</text>
  <text x="300" y="222" font-size="9" letter-spacing="1.5" fill="rgba(245,247,250,0.3)" font-family="monospace">FAVICON 64px</text>

  <rect x="380" y="140" width="48" height="48" fill="#050608"/>
  <text x="384" y="182" font-weight="800" font-size="34" letter-spacing="-1" fill="#F5F7FA">S.</text>
  <text x="380" y="208" font-size="9" letter-spacing="1.5" fill="rgba(245,247,250,0.3)" font-family="monospace">48px</text>

  <rect x="445" y="140" width="32" height="32" fill="#050608"/>
  <text x="448" y="164" font-weight="800" font-size="22" letter-spacing="-1" fill="#F5F7FA">S.</text>
  <text x="445" y="190" font-size="9" letter-spacing="1.5" fill="rgba(245,247,250,0.3)" font-family="monospace">32px</text>

  <!-- Zona de protección illustration -->
  <rect x="600" y="155" width="280" height="90" fill="#0B1117"/>
  <rect x="618" y="163" width="244" height="74" fill="none" stroke="rgba(34,211,238,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="640" y="218" font-weight="800" font-size="44" letter-spacing="-1.5" fill="#F5F7FA">Stratika.</text>
  <text x="600" y="248" font-size="9" letter-spacing="2" fill="rgba(34,211,238,0.5)" font-family="monospace">ZONA DE PROTECCIÓN = ALTURA "S"</text>
</svg>
